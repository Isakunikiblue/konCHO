<style>
  :root {
    --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;

    /* Theme: Dark (Default) */
    --bg-app: #0b0f19;
    --bg-card: #151d2f;
    --bg-card-hover: #1c263c;
    --bg-elevated: #1e293f;
    --bg-input: #0f172a;
    --border-color: #27354f;
    --border-subtle: #1c263a;

    --text-primary: #f8fafc;
    --text-secondary: #94a3b8;
    --text-muted: #64748b;

    --primary-color: #6366f1;
    --primary-hover: #4f46e5;
    --primary-light: rgba(99, 102, 241, 0.16);

    /* Service Colors */
    --mobile-color: #c084fc;
    --mobile-bg: rgba(192, 132, 252, 0.16);
    --mobile-border: rgba(192, 132, 252, 0.35);

    --fixed-color: #38bdf8;
    --fixed-bg: rgba(56, 189, 248, 0.16);
    --fixed-border: rgba(56, 189, 248, 0.35);

    /* Status Colors */
    --status-open-color: #fbbf24;
    --status-open-bg: rgba(251, 191, 36, 0.14);
    --status-open-border: rgba(251, 191, 36, 0.35);

    --status-prog-color: #60a5fa;
    --status-prog-bg: rgba(96, 165, 250, 0.14);
    --status-prog-border: rgba(96, 165, 250, 0.35);

    --status-closed-color: #34d399;
    --status-closed-bg: rgba(52, 211, 153, 0.14);
    --status-closed-border: rgba(52, 211, 153, 0.35);

    --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.3);
    --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.35), 0 2px 4px -2px rgba(0, 0, 0, 0.25);
    --shadow-lg: 0 10px 20px -3px rgba(0, 0, 0, 0.5), 0 4px 6px -2px rgba(0, 0, 0, 0.3);

    --radius-sm: 6px;
    --radius-md: 10px;
    --radius-lg: 14px;
    --radius-full: 9999px;
    --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  }

  /* Light Theme */
  [data-theme="light"] {
    --bg-app: #f1f5f9;
    --bg-card: #ffffff;
    --bg-card-hover: #f8fafc;
    --bg-elevated: #f1f5f9;
    --bg-input: #ffffff;
    --border-color: #e2e8f0;
    --border-subtle: #cbd5e1;

    --text-primary: #0f172a;
    --text-secondary: #475569;
    --text-muted: #94a3b8;

    --primary-color: #4f46e5;
    --primary-hover: #4338ca;
    --primary-light: rgba(79, 70, 229, 0.12);

    --mobile-color: #9333ea;
    --mobile-bg: rgba(147, 51, 234, 0.12);
    --mobile-border: rgba(147, 51, 234, 0.28);

    --fixed-color: #0284c7;
    --fixed-bg: rgba(2, 132, 199, 0.12);
    --fixed-border: rgba(2, 132, 199, 0.28);

    --status-open-color: #d97706;
    --status-open-bg: rgba(217, 119, 6, 0.12);
    --status-open-border: rgba(217, 119, 6, 0.28);

    --status-prog-color: #2563eb;
    --status-prog-bg: rgba(37, 99, 235, 0.12);
    --status-prog-border: rgba(37, 99, 235, 0.28);

    --status-closed-color: #059669;
    --status-closed-bg: rgba(5, 150, 105, 0.12);
    --status-closed-border: rgba(5, 150, 105, 0.28);

    --shadow-sm: 0 1px 3px 0 rgba(0, 0, 0, 0.08);
    --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.08);
    --shadow-lg: 0 10px 20px -3px rgba(0, 0, 0, 0.12);
  }

  /* Reset & Base */
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: var(--font-sans);
  }

  html {
    height: 100%;
    overflow-x: hidden;
    overflow-y: auto;
  }

  body {
    background-color: var(--bg-app);
    color: var(--text-primary);
    min-height: 100%;
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
    overflow-y: auto;
    -webkit-font-smoothing: antialiased;
  }

  /* Scrollbar - Lebar 10px, jelas terlihat, dan nyaman di-scroll */
  ::-webkit-scrollbar {
    width: 10px;
    height: 10px;
  }
  ::-webkit-scrollbar-track {
    background: var(--bg-app);
  }
  ::-webkit-scrollbar-thumb {
    background: var(--border-color);
    border-radius: var(--radius-full);
    border: 2px solid var(--bg-app);
  }
  ::-webkit-scrollbar-thumb:hover {
    background: var(--primary-color);
  }

  /* =========================================================================
     1. TOP HEADER
     ========================================================================= */
  .app-header {
    height: 72px;
    background: var(--bg-card);
    border-bottom: 1px solid var(--border-color);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 24px;
    flex-shrink: 0;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: var(--shadow-sm);
  }

  .header-left {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .brand-box {
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 2px;
  }

  .brand-logo-wrap {
    display: inline-flex;
    align-items: center;
    line-height: 1;
    background: #002b56;
    padding: 3px 10px;
    border-radius: 8px;
    border: 1px solid rgba(255, 255, 255, 0.15);
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25);
    transition: var(--transition);
  }

  .brand-logo-wrap:hover {
    border-color: #d4af37;
    box-shadow: 0 4px 12px rgba(0, 43, 86, 0.4);
  }

  .brand-logo-img {
    height: 46px;
    max-height: 46px;
    width: auto;
    display: block;
    object-fit: contain;
    filter: drop-shadow(0 2px 5px rgba(0, 0, 0, 0.35));
  }

  [data-theme="light"] .brand-logo-wrap {
    background: #002b56;
    border: 1px solid rgba(0, 43, 86, 0.3);
  }
  [data-theme="light"] .brand-logo-img {
    height: 46px;
    filter: none;
  }

  .brand-sub {
    font-size: 11px;
    color: var(--text-muted);
    font-weight: 600;
    letter-spacing: 0.3px;
  }

  .db-status-pill {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 4px 12px;
    background: var(--bg-elevated);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-full);
    font-size: 11.5px;
    color: var(--text-secondary);
    font-weight: 500;
    margin-left: 8px;
  }

  .status-indicator-dot {
    width: 8px;
    height: 8px;
    background: #10b981;
    border-radius: 50%;
    box-shadow: 0 0 8px #10b981;
  }

  .header-actions {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .btn-hdr {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 8px 16px;
    font-size: 13px;
    font-weight: 600;
    border-radius: var(--radius-md);
    background: var(--bg-elevated);
    border: 1px solid var(--border-color);
    color: var(--text-primary);
    cursor: pointer;
    transition: var(--transition);
  }
  .btn-hdr:hover {
    background: var(--bg-card-hover);
    border-color: var(--text-muted);
    transform: translateY(-1px);
  }

  .btn-hdr.btn-primary {
    background: linear-gradient(135deg, var(--primary-color), #4f46e5);
    color: #ffffff;
    border: none;
    box-shadow: 0 4px 12px rgba(99, 102, 241, 0.35);
  }
  .btn-hdr.btn-primary:hover {
    filter: brightness(1.1);
    box-shadow: 0 6px 16px rgba(99, 102, 241, 0.45);
  }

  /* =========================================================================
     2. APP LAYOUT: SIDEBAR KIRI + AREA UTAMA KANAN
     ========================================================================= */
  .app-layout {
    flex: 1;
    display: flex;
    min-height: calc(100vh - 66px);
  }

  /* -------------------------------------------------------------------------
     SIDEBAR KIRI (SEBELAH KIRI)
     Memuat: Semua Layanan, Bulan, dan Total Kasus
     ------------------------------------------------------------------------- */
  .sidebar-left {
    width: 270px;
    background: var(--bg-card);
    border-right: 1px solid var(--border-color);
    display: flex;
    flex-direction: column;
    padding: 20px 16px;
    gap: 22px;
    flex-shrink: 0;
    position: sticky;
    top: 72px;
    height: calc(100vh - 72px);
    overflow-y: auto;
    z-index: 30;
  }

  .sidebar-block {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .sidebar-block-title {
    font-size: 11px;
    font-weight: 750;
    text-transform: uppercase;
    letter-spacing: 0.7px;
    color: var(--text-muted);
    padding: 0 4px;
  }

  /* Nav List Layanan */
  .sidebar-nav-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .sidebar-nav-btn {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 14px;
    border-radius: var(--radius-md);
    background: var(--bg-elevated);
    border: 1px solid var(--border-color);
    color: var(--text-secondary);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: var(--transition);
    user-select: none;
    text-align: left;
    width: 100%;
  }
  .sidebar-nav-btn:hover {
    background: var(--bg-card-hover);
    color: var(--text-primary);
    border-color: var(--text-muted);
    transform: translateX(2px);
  }
  .sidebar-nav-btn.active {
    background: var(--primary-light);
    color: var(--primary-color);
    border-color: var(--primary-color);
    font-weight: 700;
    box-shadow: 0 0 0 1px var(--primary-color);
  }

  .nav-btn-left {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .nav-icon {
    font-size: 14px;
    line-height: 1;
  }

  .nav-badge {
    font-size: 10.5px;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: var(--radius-full);
    background: var(--bg-card);
    border: 1px solid var(--border-color);
  }
  .nav-badge.srv-mobile {
    color: var(--mobile-color);
    border-color: var(--mobile-border);
    background: var(--mobile-bg);
  }
  .nav-badge.srv-fixed {
    color: var(--fixed-color);
    border-color: var(--fixed-border);
    background: var(--fixed-bg);
  }

  /* Month Selector di Sidebar */
  .sidebar-month-box {
    background: var(--bg-elevated);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-md);
    padding: 4px 10px;
    transition: var(--transition);
  }
  .sidebar-month-box:hover {
    border-color: var(--primary-color);
  }

  .month-select-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
  }
  .sidebar-month-select {
    width: 100%;
    background: transparent;
    border: none;
    color: var(--text-primary);
    font-size: 13px;
    font-weight: 700;
    padding: 6px 0;
    outline: none;
    cursor: pointer;
  }
  .sidebar-month-select option {
    background: var(--bg-card);
    color: var(--text-primary);
  }

  /* Status KPI List di Sidebar */
  .sidebar-kpi-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .kpi-nav-btn {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 9px 12px;
    border-radius: var(--radius-md);
    background: var(--bg-elevated);
    border: 1px solid var(--border-color);
    color: var(--text-secondary);
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    transition: var(--transition);
    user-select: none;
    text-align: left;
    width: 100%;
  }
  .kpi-nav-btn:hover {
    background: var(--bg-card-hover);
    color: var(--text-primary);
    transform: translateX(2px);
  }

  .kpi-nav-left {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .kpi-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
  }
  .dot-open { background: var(--status-open-color); box-shadow: 0 0 6px var(--status-open-color); }
  .dot-inprogress { background: var(--status-prog-color); box-shadow: 0 0 6px var(--status-prog-color); }
  .dot-closed { background: var(--status-closed-color); box-shadow: 0 0 6px var(--status-closed-color); }

  .kpi-count-badge {
    font-size: 12px;
    font-weight: 800;
    padding: 2px 8px;
    border-radius: var(--radius-full);
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    color: var(--text-primary);
  }

  /* Active KPI button styling */
  .kpi-nav-btn.total.active {
    background: var(--primary-light);
    border-color: var(--primary-color);
    color: var(--primary-color);
    font-weight: 700;
  }
  .kpi-nav-btn.total.active .kpi-count-badge {
    background: var(--primary-color);
    color: #ffffff;
    border-color: var(--primary-color);
  }

  .kpi-nav-btn.open.active {
    background: var(--status-open-bg);
    border-color: var(--status-open-color);
    color: var(--status-open-color);
    font-weight: 700;
  }
  .kpi-nav-btn.open.active .kpi-count-badge {
    background: var(--status-open-color);
    color: #000000;
    border-color: var(--status-open-color);
  }

  .kpi-nav-btn.inprogress.active {
    background: var(--status-prog-bg);
    border-color: var(--status-prog-color);
    color: var(--status-prog-color);
    font-weight: 700;
  }
  .kpi-nav-btn.inprogress.active .kpi-count-badge {
    background: var(--status-prog-color);
    color: #ffffff;
    border-color: var(--status-prog-color);
  }

  .kpi-nav-btn.closed.active {
    background: var(--status-closed-bg);
    border-color: var(--status-closed-color);
    color: var(--status-closed-color);
    font-weight: 700;
  }
  .kpi-nav-btn.closed.active .kpi-count-badge {
    background: var(--status-closed-color);
    color: #ffffff;
    border-color: var(--status-closed-color);
  }

  .sidebar-footer-info {
    margin-top: auto;
    padding-top: 10px;
  }
  .sheet-info-card {
    background: var(--bg-elevated);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-md);
    padding: 10px 12px;
    font-size: 11px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    color: var(--text-muted);
  }
  .sheet-info-title {
    font-weight: 700;
    color: var(--text-secondary);
  }
  .sheet-info-desc code {
    color: var(--primary-color);
    font-weight: 600;
  }

  /* -------------------------------------------------------------------------
     AREA UTAMA KANAN (MAIN CONTENT)
     Memuat: Search Bar + Satu Card Tunggal Wadah Semua Kasus
     ------------------------------------------------------------------------- */
  .content-main {
    flex: 1;
    min-width: 0;
    padding: 22px 28px 80px 28px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  .content-header-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    flex-wrap: wrap;
  }

  .search-box-large {
    flex: 1;
    min-width: 280px;
    position: relative;
    display: flex;
    align-items: center;
  }

  .search-icon {
    position: absolute;
    left: 14px;
    color: var(--text-muted);
    pointer-events: none;
    display: flex;
    align-items: center;
  }

  .search-input-field {
    width: 100%;
    padding: 10px 40px 10px 40px;
    border-radius: var(--radius-md);
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    color: var(--text-primary);
    font-size: 13.5px;
    outline: none;
    transition: var(--transition);
    box-shadow: var(--shadow-sm);
  }
  .search-input-field:focus {
    border-color: var(--primary-color);
    box-shadow: 0 0 0 2px var(--primary-light);
  }

  .btn-clear-search {
    position: absolute;
    right: 12px;
    background: transparent;
    border: none;
    color: var(--text-muted);
    font-size: 13px;
    cursor: pointer;
    padding: 4px;
  }
  .btn-clear-search:hover {
    color: var(--text-primary);
  }

  .active-scope-pill {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-secondary);
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    padding: 7px 14px;
    border-radius: var(--radius-full);
    box-shadow: var(--shadow-sm);
    white-space: nowrap;
  }

  /* =========================================================================
     3. UNIFIED CASES CARD (SATU CARD UTAMA TUNGGAL)
     Kasus 1 dan 2 dst dibuat dalam satu card saja (Unified Group Card)
     ========================================================================= */
  .unified-cases-card {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-sm);
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  .cases-card-header {
    padding: 18px 24px;
    background: var(--bg-card);
    border-bottom: 1px solid var(--border-color);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }

  .header-card-left {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .cases-card-title {
    font-size: 17px;
    font-weight: 800;
    color: var(--text-primary);
    letter-spacing: -0.2px;
  }

  .cases-count-badge {
    font-size: 12px;
    font-weight: 700;
    color: var(--primary-color);
    background: var(--primary-light);
    border: 1px solid rgba(99, 102, 241, 0.25);
    padding: 3px 10px;
    border-radius: var(--radius-full);
  }

  .header-card-right .hint-text {
    font-size: 12px;
    color: var(--text-muted);
  }

  /* Body Card Tunggal */
  .cases-card-body {
    display: flex;
    flex-direction: column;
  }

  /* Baris Item Kasus di dalam Card Tunggal (Divided by borders) */
  .case-item-row {
    padding: 22px 24px;
    border-bottom: 1px solid var(--border-color);
    display: flex;
    flex-direction: column;
    gap: 14px;
    transition: var(--transition);
    position: relative;
    background: var(--bg-card);
  }
  .case-item-row:last-child {
    border-bottom: none;
  }
  .case-item-row:hover {
    background: var(--bg-card-hover);
  }

  /* Status Border Kiri */
  .case-item-row.status-open {
    border-left: 4px solid var(--status-open-color);
  }
  .case-item-row.status-inprogress {
    border-left: 4px solid var(--status-prog-color);
  }
  .case-item-row.status-closed {
    border-left: 4px solid var(--status-closed-color);
  }

  /* Header Baris Item Kasus */
  .case-row-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
  }

  .case-row-badges {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  .badge-id {
    font-size: 12px;
    font-weight: 800;
    color: var(--text-primary);
    background: var(--bg-elevated);
    padding: 3px 9px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border-color);
  }

  .badge-srv {
    font-size: 11px;
    font-weight: 700;
    padding: 3px 9px;
    border-radius: var(--radius-sm);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .badge-srv.mobile {
    background: var(--mobile-bg);
    color: var(--mobile-color);
    border: 1px solid var(--mobile-border);
  }
  .badge-srv.fixed {
    background: var(--fixed-bg);
    color: var(--fixed-color);
    border: 1px solid var(--fixed-border);
  }

  .badge-month {
    font-size: 11px;
    font-weight: 600;
    color: var(--text-muted);
    background: var(--bg-elevated);
    padding: 3px 8px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border-color);
  }

  .badge-status-pill {
    font-size: 11.5px;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: var(--radius-full);
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }
  .badge-status-pill.open {
    background: var(--status-open-bg);
    color: var(--status-open-color);
    border: 1px solid var(--status-open-border);
  }
  .badge-status-pill.inprogress {
    background: var(--status-prog-bg);
    color: var(--status-prog-color);
    border: 1px solid var(--status-prog-border);
  }
  .badge-status-pill.closed {
    background: var(--status-closed-bg);
    color: var(--status-closed-color);
    border: 1px solid var(--status-closed-border);
  }

  .case-row-time {
    font-size: 12px;
    color: var(--text-muted);
    font-weight: 500;
  }

  /* Judul Kasus (Kolom B - Total Case Isu yang masuk) */
  .case-row-title {
    font-size: 16.5px;
    font-weight: 750;
    color: var(--text-primary);
    line-height: 1.4;
    letter-spacing: -0.2px;
  }

  /* Meta Attributes: Requestor (Kolom G) & Follow Up To (Kolom I) */
  .case-row-meta {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    font-size: 12.5px;
  }

  .meta-item {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    color: var(--text-secondary);
    background: var(--bg-elevated);
    padding: 4px 10px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border-color);
  }
  .meta-item strong {
    color: var(--text-primary);
    font-weight: 600;
  }
  .meta-item.followup strong {
    color: var(--fixed-color);
  }

  /* Kotak Keterangan Status Callout Box */
  .case-note-box {
    border-radius: var(--radius-md);
    padding: 12px 16px;
    font-size: 13px;
    line-height: 1.5;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .note-box-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
  }

  .note-label {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  .note-author-info {
    font-size: 12px;
    font-weight: 500;
  }

  .note-content-text {
    font-size: 13.5px;
    color: var(--text-primary);
    white-space: pre-wrap;
    word-break: break-word;
  }

  /* Note Box Themes */
  .note-box-open {
    background: rgba(245, 158, 11, 0.08);
    border: 1px solid rgba(245, 158, 11, 0.22);
  }
  .note-box-open .note-label { color: var(--status-open-color); }
  .note-box-open .note-author-info { color: var(--text-muted); }

  .note-box-inprogress {
    background: rgba(59, 130, 246, 0.09);
    border: 1px solid rgba(59, 130, 246, 0.28);
  }
  .note-box-inprogress .note-label { color: var(--status-prog-color); }
  .note-box-inprogress .note-author-info { color: var(--text-secondary); }
  .note-box-inprogress .note-author-info strong { color: var(--status-prog-color); }

  .note-box-closed {
    background: rgba(16, 185, 129, 0.09);
    border: 1px solid rgba(16, 185, 129, 0.28);
  }
  .note-box-closed .note-label { color: var(--status-closed-color); }
  .note-box-closed .note-author-info { color: var(--text-secondary); }
  .note-box-closed .note-author-info strong { color: var(--status-closed-color); }

  /* Tombol Aksi di Baris Kasus */
  .case-row-actions {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    padding-top: 6px;
  }

  .action-primary-group {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  .action-secondary-group {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .btn-act {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 7px 14px;
    font-size: 12.5px;
    font-weight: 600;
    border-radius: var(--radius-md);
    cursor: pointer;
    transition: var(--transition);
    user-select: none;
    border: 1px solid transparent;
  }
  .btn-act:hover {
    transform: translateY(-1px);
    box-shadow: var(--shadow-sm);
  }

  .btn-act-inprogress {
    background: var(--status-prog-bg);
    color: var(--status-prog-color);
    border-color: var(--status-prog-border);
  }
  .btn-act-inprogress:hover {
    background: var(--status-prog-color);
    color: #ffffff;
  }

  .btn-act-closed {
    background: var(--status-closed-bg);
    color: var(--status-closed-color);
    border-color: var(--status-closed-border);
  }
  .btn-act-closed:hover {
    background: var(--status-closed-color);
    color: #ffffff;
  }

  .btn-act-reopen {
    background: var(--status-open-bg);
    color: var(--status-open-color);
    border-color: var(--status-open-border);
  }
  .btn-act-reopen:hover {
    background: var(--status-open-color);
    color: #000000;
  }

  .btn-act-update {
    background: var(--bg-elevated);
    color: var(--text-primary);
    border-color: var(--border-color);
  }
  .btn-act-update:hover {
    border-color: var(--primary-color);
    color: var(--primary-color);
  }

  .btn-act-log {
    background: var(--bg-elevated);
    color: var(--text-secondary);
    border-color: var(--border-color);
  }
  .btn-act-log:hover {
    color: var(--text-primary);
    border-color: var(--text-muted);
  }

  /* Footer Card Tunggal */
  .cases-card-footer {
    padding: 14px 24px;
    background: var(--bg-card);
    border-top: 1px solid var(--border-color);
    font-size: 12.5px;
    color: var(--text-muted);
    font-weight: 500;
  }

  /* Empty State di dalam Card */
  .empty-card-state {
    padding: 60px 20px;
    text-align: center;
    color: var(--text-muted);
  }
  .empty-icon {
    font-size: 38px;
    margin-bottom: 12px;
  }
  .empty-title {
    font-size: 16px;
    font-weight: 700;
    color: var(--text-primary);
    margin-bottom: 6px;
  }
  .empty-desc {
    font-size: 13px;
    max-width: 360px;
    margin: 0 auto;
    line-height: 1.5;
  }

  /* =========================================================================
     4. MODAL DIALOGS
     ========================================================================= */
  .modal-backdrop {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(0, 0, 0, 0.72);
    backdrop-filter: blur(4px);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 100;
    animation: fadeIn 0.2s ease;
  }
  .modal-backdrop.active {
    display: flex;
  }

  .modal-dialog {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-lg);
    width: 100%;
    max-width: 600px;
    max-height: 90vh;
    display: flex;
    flex-direction: column;
    box-shadow: var(--shadow-lg);
    overflow: hidden;
    animation: scaleIn 0.22s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .modal-dialog.modal-lg {
    max-width: 760px;
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  @keyframes scaleIn {
    from { transform: scale(0.96) translateY(10px); opacity: 0; }
    to { transform: scale(1) translateY(0); opacity: 1; }
  }

  .modal-head {
    padding: 18px 22px;
    border-bottom: 1px solid var(--border-color);
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
  }

  .modal-kicker {
    font-size: 11.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 4px;
    color: var(--primary-color);
  }
  .modal-kicker.blue-kicker { color: var(--status-prog-color); }
  .modal-kicker.green-kicker { color: var(--status-closed-color); }

  .modal-title {
    font-size: 17px;
    font-weight: 800;
    color: var(--text-primary);
    line-height: 1.3;
  }

  .modal-close-btn {
    background: transparent;
    border: none;
    color: var(--text-muted);
    font-size: 16px;
    cursor: pointer;
    padding: 4px 8px;
    border-radius: var(--radius-sm);
    line-height: 1;
    transition: var(--transition);
  }
  .modal-close-btn:hover {
    background: var(--bg-elevated);
    color: var(--text-primary);
  }

  .modal-body {
    padding: 20px 22px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .modal-foot {
    padding: 16px 22px;
    border-top: 1px solid var(--border-color);
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 10px;
    background: var(--bg-card);
  }

  /* Modal Info Box */
  .modal-info-box {
    border-radius: var(--radius-md);
    padding: 12px 14px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .modal-info-box.blue-info-box {
    background: rgba(59, 130, 246, 0.08);
    border: 1px solid rgba(59, 130, 246, 0.25);
  }
  .modal-info-box.green-info-box {
    background: rgba(16, 185, 129, 0.08);
    border: 1px solid rgba(16, 185, 129, 0.25);
  }

  .info-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
  }
  .info-badge {
    font-size: 10px;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: var(--radius-sm);
    background: var(--bg-card);
    border: 1px solid var(--border-color);
  }
  .info-id {
    font-weight: 800;
    color: var(--text-primary);
  }
  .info-req {
    color: var(--text-secondary);
  }
  .info-issue {
    font-size: 14px;
    font-weight: 700;
    color: var(--text-primary);
    line-height: 1.35;
  }

  /* Form Elements */
  .form-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .form-row-2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }

  .form-label {
    font-size: 12.5px;
    font-weight: 600;
    color: var(--text-secondary);
  }
  .req-star {
    color: #ef4444;
  }

  .form-control {
    background: var(--bg-input);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-md);
    padding: 9px 12px;
    color: var(--text-primary);
    font-size: 13.5px;
    outline: none;
    transition: var(--transition);
  }
  .form-control:focus {
    border-color: var(--primary-color);
    box-shadow: 0 0 0 2px var(--primary-light);
  }

  textarea.form-control {
    min-height: 80px;
    resize: vertical;
    line-height: 1.45;
  }

  .form-hint {
    font-size: 11.5px;
    color: var(--text-muted);
    line-height: 1.4;
  }

  .modal-service-toggle {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .service-toggle-btn {
    padding: 10px 14px;
    background: var(--bg-elevated);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-md);
    color: var(--text-secondary);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: var(--transition);
  }
  .service-toggle-btn:hover {
    color: var(--text-primary);
    border-color: var(--text-muted);
  }
  .service-toggle-btn.active {
    background: var(--primary-light);
    border-color: var(--primary-color);
    color: var(--primary-color);
    font-weight: 700;
  }

  .btn-secondary {
    padding: 8px 16px;
    border-radius: var(--radius-md);
    background: var(--bg-elevated);
    border: 1px solid var(--border-color);
    color: var(--text-secondary);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: var(--transition);
  }
  .btn-secondary:hover {
    background: var(--bg-card-hover);
    color: var(--text-primary);
  }

  .btn-primary {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 9px 18px;
    border-radius: var(--radius-md);
    background: linear-gradient(135deg, var(--primary-color), #4f46e5);
    border: none;
    color: #ffffff;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    transition: var(--transition);
    box-shadow: 0 2px 8px rgba(99, 102, 241, 0.35);
  }
  .btn-primary:hover {
    filter: brightness(1.1);
    transform: translateY(-1px);
    box-shadow: 0 4px 14px rgba(99, 102, 241, 0.45);
  }
  .btn-primary:disabled {
    opacity: 0.6;
    cursor: not-allowed;
    transform: none;
  }

  .btn-save-inprogress {
    background: linear-gradient(135deg, #2563eb, #3b82f6);
    box-shadow: 0 2px 8px rgba(37, 99, 235, 0.35);
  }
  .btn-save-inprogress:hover {
    box-shadow: 0 4px 14px rgba(37, 99, 235, 0.45);
  }

  .btn-save-closed {
    background: linear-gradient(135deg, #059669, #10b981);
    box-shadow: 0 2px 8px rgba(16, 185, 129, 0.35);
  }
  .btn-save-closed:hover {
    box-shadow: 0 4px 14px rgba(16, 185, 129, 0.45);
  }

  /* Log Modal Timeline */
  .log-case-banner {
    background: var(--bg-elevated);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-md);
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .banner-field {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .field-k {
    font-size: 11px;
    font-weight: 700;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.4px;
  }
  .field-v-bold {
    font-size: 14.5px;
    font-weight: 700;
    color: var(--text-primary);
  }
  .banner-grid-4 {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
    gap: 10px;
    font-size: 12.5px;
  }

  .log-timeline-container {
    display: flex;
    flex-direction: column;
    gap: 10px;
    max-height: 280px;
    overflow-y: auto;
    padding-right: 4px;
  }

  .log-timeline-item {
    background: var(--bg-elevated);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-md);
    padding: 10px 14px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .log-item-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 12px;
  }
  .log-item-author {
    font-weight: 700;
    color: var(--text-primary);
  }
  .log-item-time {
    color: var(--text-muted);
  }
  .log-item-msg {
    font-size: 13px;
    color: var(--text-primary);
    white-space: pre-wrap;
  }
  .log-item-badges {
    display: flex;
    gap: 6px;
    margin-top: 4px;
  }

  .log-quick-add {
    margin-top: 10px;
    padding-top: 14px;
    border-top: 1px solid var(--border-color);
  }
  .quick-add-row {
    display: flex;
    gap: 10px;
  }

  /* Toast Notification */
  .toast-container {
    position: fixed;
    bottom: 24px;
    right: 24px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    z-index: 200;
    pointer-events: none;
  }

  .toast {
    pointer-events: auto;
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    color: var(--text-primary);
    padding: 12px 18px;
    border-radius: var(--radius-md);
    box-shadow: var(--shadow-lg);
    font-size: 13px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 10px;
    animation: toastIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .toast.success { border-left: 4px solid #10b981; }
  .toast.error { border-left: 4px solid #ef4444; }
  .toast.info { border-left: 4px solid var(--primary-color); }

  @keyframes toastIn {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Responsive Rules */
  @media (max-width: 900px) {
    .app-layout {
      flex-direction: column;
    }
    .sidebar-left {
      width: 100%;
      height: auto;
      position: static;
      border-right: none;
      border-bottom: 1px solid var(--border-color);
      overflow-y: visible;
    }
    .content-main {
      padding: 16px;
    }
  }

  @media (max-width: 640px) {
    .app-header {
      padding: 0 14px;
    }
    .db-status-pill {
      display: none;
    }
    .form-row-2 {
      grid-template-columns: 1fr;
    }
    .case-row-header {
      flex-direction: column;
      align-items: flex-start;
    }
    .case-row-actions {
      flex-direction: column;
      align-items: flex-start;
    }
    .action-primary-group {
      width: 100%;
    }
    .action-secondary-group {
      width: 100%;
      justify-content: flex-end;
    }
  }

  /* =========================================================================
     USER PROFILE BADGE & LOGOUT (HEADER)
     ========================================================================= */
  .user-profile-badge {
    display: flex;
    align-items: center;
    gap: 9px;
    background: var(--bg-elevated);
    padding: 4px 12px;
    border-radius: var(--radius-full);
    border: 1px solid var(--border-color);
  }
  .user-avatar {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: rgba(212, 175, 55, 0.2);
    color: #f6c84c;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 700;
  }
  .user-info {
    display: flex;
    flex-direction: column;
    line-height: 1.15;
  }
  .user-name {
    font-size: 11.5px;
    font-weight: 700;
    color: var(--text-primary);
  }
  .user-role {
    font-size: 9.5px;
    color: var(--text-muted);
  }
  .btn-logout {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 4px 8px;
    font-size: 11px;
    font-weight: 600;
    color: #ef4444;
    background: rgba(239, 68, 68, 0.08);
    border: 1px solid rgba(239, 68, 68, 0.25);
    border-radius: var(--radius-sm);
    cursor: pointer;
    transition: var(--transition);
  }
  .btn-logout:hover {
    background: rgba(239, 68, 68, 0.18);
    border-color: #ef4444;
    transform: translateY(-1px);
  }

  /* =========================================================================
     HALAMAN LOGIN (AUTHENTICATION VIEW)
     ========================================================================= */
  .login-view-container {
    min-height: 100vh;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 50% 25%, #0f274a 0%, #071326 60%, #030813 100%);
    padding: 24px;
    position: fixed;
    inset: 0;
    z-index: 999999;
    overflow-y: auto;
  }
  .login-card {
    width: 100%;
    max-width: 440px;
    background: rgba(17, 26, 44, 0.95);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 18px;
    padding: 34px 30px;
    box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7), 0 0 50px rgba(0, 43, 86, 0.35);
    backdrop-filter: blur(16px);
    position: relative;
    animation: fadeInLogin 0.35s cubic-bezier(0.16, 1, 0.3, 1);
  }
  @keyframes fadeInLogin {
    from { opacity: 0; transform: translateY(14px) scale(0.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  .login-brand {
    text-align: center;
    margin-bottom: 20px;
  }
  .login-logo-wrap {
    display: inline-block;
    background: #002b56;
    padding: 6px 16px;
    border-radius: 12px;
    border: 1px solid rgba(255, 255, 255, 0.18);
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
    margin-bottom: 10px;
  }
  .login-logo-img {
    height: 64px;
    max-height: 70px;
    width: auto;
    display: block;
    object-fit: contain;
  }
  .login-brand-sub {
    font-size: 11px;
    font-weight: 700;
    color: #94a3b8;
    letter-spacing: 0.5px;
    margin: 0;
    text-transform: uppercase;
  }
  .login-welcome {
    text-align: center;
    margin-bottom: 22px;
  }
  .login-welcome h2 {
    font-size: 19px;
    font-weight: 800;
    color: #f8fafc;
    margin: 0 0 5px 0;
  }
  .login-welcome p {
    font-size: 12.5px;
    color: #94a3b8;
    margin: 0;
  }
  .login-form {
    display: flex;
    flex-direction: column;
    gap: 15px;
  }
  .input-with-icon {
    position: relative;
    display: flex;
    align-items: center;
  }
  .input-with-icon .input-icon {
    position: absolute;
    left: 12px;
    color: #64748b;
    pointer-events: none;
  }
  .input-with-icon .form-control {
    padding-left: 38px;
    height: 42px;
    font-size: 13.5px;
    background: #0a1120;
    border: 1px solid #1e293b;
    color: #f8fafc;
    border-radius: 10px;
    width: 100%;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .input-with-icon .form-control:focus {
    border-color: #f6c84c;
    box-shadow: 0 0 0 3px rgba(246, 200, 76, 0.2);
    outline: none;
  }
  .login-options {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12px;
    color: #94a3b8;
  }
  .remember-label {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
  }
  .btn-login-submit {
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    background: linear-gradient(135deg, #f6c84c 0%, #d4af37 100%);
    color: #0b1120;
    font-weight: 800;
    font-size: 13.5px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.2s;
    box-shadow: 0 4px 14px rgba(212, 175, 55, 0.35);
    margin-top: 4px;
  }
  .btn-login-submit:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 18px rgba(212, 175, 55, 0.45);
    filter: brightness(1.05);
  }
  .demo-login-box {
    margin-top: 6px;
    padding-top: 12px;
    border-top: 1px dashed rgba(255, 255, 255, 0.1);
    text-align: center;
  }
  .demo-hint-text {
    font-size: 11px;
